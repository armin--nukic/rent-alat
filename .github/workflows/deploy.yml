name: Build and deploy

on:
  push:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: production-deployment
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  FRONTEND_IMAGE: ghcr.io/${{ github.repository_owner }}/rent-alat-frontend
  BACKEND_IMAGE: ghcr.io/${{ github.repository_owner }}/rent-alat-backend

jobs:
  validate:
    name: Validate application
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            backend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Validate backend syntax
        working-directory: backend
        run: |
          npm ci
          node --check src/server.js
          node --check prisma/seed.js

  build:
    name: Build ${{ matrix.service }} image
    needs: validate
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        include:
          - service: frontend
            context: ./frontend
            image: ghcr.io/${{ github.repository_owner }}/rent-alat-frontend
          - service: backend
            context: ./backend
            image: ghcr.io/${{ github.repository_owner }}/rent-alat-backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ matrix.image }}
          tags: |
            type=raw,value=sha-${{ github.sha }}
            type=raw,value=latest

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  deploy:
    name: Deploy to production VPS
    needs: build
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Upload production Compose file
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: docker-compose.prod.yml
          target: /opt/rent-alat
          overwrite: true

      - name: Pull images and deploy
        uses: appleboy/ssh-action@v1
        env:
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.repository_owner }}
          IMAGE_TAG: sha-${{ github.sha }}
          FRONTEND_IMAGE_REPOSITORY: ${{ env.FRONTEND_IMAGE }}
          BACKEND_IMAGE_REPOSITORY: ${{ env.BACKEND_IMAGE }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: GHCR_TOKEN,GHCR_USER,IMAGE_TAG,FRONTEND_IMAGE_REPOSITORY,BACKEND_IMAGE_REPOSITORY
          script_stop: true
          script: |
            set -eu
            cd /opt/rent-alat

            test -f .env || { echo "Missing /opt/rent-alat/.env"; exit 1; }
            echo "$GHCR_TOKEN" | docker login ghcr.io --username "$GHCR_USER" --password-stdin

            if [ -f images.env ]; then
              cp images.env images.env.rollback
            fi

            export FRONTEND_IMAGE="${FRONTEND_IMAGE_REPOSITORY}:${IMAGE_TAG}"
            export BACKEND_IMAGE="${BACKEND_IMAGE_REPOSITORY}:${IMAGE_TAG}"
            printf 'export FRONTEND_IMAGE=%s\nexport BACKEND_IMAGE=%s\n' "$FRONTEND_IMAGE" "$BACKEND_IMAGE" > images.env.next

            docker compose -f docker-compose.prod.yml pull

            if docker compose -f docker-compose.prod.yml up -d --remove-orphans --wait --wait-timeout 180; then
              mv images.env.next images.env
              rm -f images.env.rollback
            else
              echo "Deployment failed; attempting rollback"
              if [ -f images.env.rollback ]; then
                . ./images.env.rollback
                docker compose -f docker-compose.prod.yml up -d --remove-orphans --wait --wait-timeout 180
                mv images.env.rollback images.env
              fi
              rm -f images.env.next
              exit 1
            fi

            curl --fail --silent --show-error --retry 10 --retry-delay 3 "http://127.0.0.1:${FRONTEND_HOST_PORT:-7777}/healthz"
            docker image prune -f
