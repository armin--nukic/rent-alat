services:
  database:
    image: postgres:16-alpine
    container_name: rent-alat-postgres
    environment:
      POSTGRES_DB: rent_alat
      POSTGRES_USER: rent_alat
      POSTGRES_PASSWORD: rent_alat_secure_2026
    ports:
      - "5544:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rent_alat -d rent_alat"]
      interval: 5s
      timeout: 5s
      retries: 15

  backend:
    build: ./backend
    container_name: rent-alat-api
    environment:
      NODE_ENV: production
      PORT: 8888
      DATABASE_URL: postgresql://rent_alat:rent_alat_secure_2026@database:5432/rent_alat?schema=public
      JWT_SECRET: change-this-secret-before-public-deployment
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: AdminRentAlat2026!
      CORS_ORIGIN: http://localhost:7777
      CONTACT_RECIPIENT: arminnuk@gmail.com
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-Rent Alat BiH <no-reply@rent-alat.ice.lol>}
    ports:
      - "8888:8888"
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      database:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: rent-alat-web
    ports:
      - "7777:80"
    depends_on:
      - backend

  prisma-studio:
    build: ./backend
    container_name: rent-alat-prisma-studio
    command: npx prisma studio --hostname 0.0.0.0 --port 6666
    environment:
      DATABASE_URL: postgresql://rent_alat:rent_alat_secure_2026@database:5432/rent_alat?schema=public
    ports:
      - "6666:6666"
    depends_on:
      database:
        condition: service_healthy
    profiles: ["tools"]

volumes:
  postgres_data:
  uploads_data:
