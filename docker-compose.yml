services:
  database:
    image: postgres:16-alpine
    container_name: rent-alat-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_HOST_PORT:-5544}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 15

  backend:
    build: ./backend
    container_name: rent-alat-api
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 8888
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@database:5432/${POSTGRES_DB}?schema=public
      JWT_SECRET: ${JWT_SECRET}
      ADMIN_USERNAME: ${ADMIN_USERNAME}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      CORS_ORIGIN: ${CORS_ORIGIN}
      CONTACT_RECIPIENT: ${CONTACT_RECIPIENT}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-Rent Alat BiH <no-reply@rent-alat.ice.lol>}
    ports:
      - "${BACKEND_HOST_PORT:-8888}:8888"
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      database:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: rent-alat-web
    restart: unless-stopped
    ports:
      - "${FRONTEND_HOST_PORT:-7777}:80"
    depends_on:
      - backend

  prisma-studio:
    build: ./backend
    container_name: rent-alat-prisma-studio
    command: npx prisma studio --hostname 0.0.0.0 --port 6666
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@database:5432/${POSTGRES_DB}?schema=public
    ports:
      - "${PRISMA_STUDIO_HOST_PORT:-6666}:6666"
    depends_on:
      database:
        condition: service_healthy
    profiles: ["tools"]

volumes:
  postgres_data:
  uploads_data:
